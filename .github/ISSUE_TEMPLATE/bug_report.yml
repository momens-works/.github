name: Bug Report
description: Report something that is broken or behaving unexpectedly.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping us make the issue easy to reproduce.
  - type: input
    id: area
    attributes:
      label: Area
      description: Which product area, repository, service, page, or workflow is affected?
      placeholder: "Example: momens-api auth, app invite flow, homepage deploy"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Include exact commands, URLs, inputs, or account state when relevant.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add logs, screenshots, request IDs, error messages, or links.
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, commit SHA, branch, service URL, or deployment environment.
    validations:
      required: false
